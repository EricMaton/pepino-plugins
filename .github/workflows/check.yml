name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Manifests valid, index.json up to date
        run: node scripts/build-index.mjs --check

      - name: Tests
        run: node --test "tests/*.test.mjs"
